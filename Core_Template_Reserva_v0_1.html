<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Core Template · v0.1</title>
<style>
:root{--bg:#0b0e13;--panel:#121720;--panel2:#171e29;--text:#edf2f7;--muted:#98a4b3;--line:#2a3443;--accent:#b7a7ff;--accent2:#8ed7d0;--warn:#e4bf78;--bad:#e28e91;--ok:#8ccf9c;--r:15px;--shadow:0 20px 60px #0007}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}body{background:radial-gradient(circle at 12% 0,#b7a7ff12,transparent 28%),linear-gradient(#ffffff04 1px,transparent 1px),linear-gradient(90deg,#ffffff04 1px,transparent 1px),var(--bg);background-size:auto,28px 28px,28px 28px,auto}button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.app{max-width:1240px;margin:auto;padding:0 14px 82px}.top{position:sticky;top:0;z-index:30;margin:0 -14px;padding:9px 14px;border-bottom:1px solid var(--line);background:#0b0e13e8;backdrop-filter:blur(14px)}.toprow{display:flex;align-items:center;gap:8px}.brand{border:0;background:transparent;color:var(--text);padding:5px 0;text-align:left;min-width:0}.brand b{display:block;font-size:13px;letter-spacing:.06em}.brand small{color:var(--muted);font-size:10px}.spacer{flex:1}.icon{border:1px solid var(--line);background:var(--panel);color:var(--text);width:36px;height:36px;border-radius:10px}.crumbs{display:flex;gap:5px;align-items:center;overflow:auto;margin-top:5px;font-size:11px;color:var(--muted);white-space:nowrap}.crumbs button{border:0;background:transparent;color:var(--accent2);padding:2px}.searchbar{display:flex;gap:7px;margin-top:8px}.searchbar input{flex:1}.main{padding:16px 0}.hero,.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#141a24ed,#10151ded);box-shadow:0 10px 35px #0002}.hero{padding:20px}.panel{padding:14px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.roomgrid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:14px}.roomcard,.toolcard{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:14px;text-align:left}.roomcard:hover,.toolcard:hover{border-color:#596778}.roomcard h3,.toolcard h3{margin:4px 0 6px}.ey{font-size:9px;letter-spacing:.15em;color:var(--accent2);text-transform:uppercase}.muted,.help{color:var(--muted)}.help{font-size:11px}.metrics{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.metric{border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:10px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.sectionhead h2{font-size:15px;margin:2px 0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px;border-radius:10px;min-height:36px}.btn.primary{background:var(--accent);border-color:transparent;color:#14121a;font-weight:750}.btn.soft{color:var(--accent2)}.btn.bad{color:#ffb8b8}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}label{display:grid;gap:4px;color:var(--muted);font-size:11px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#0c1016;color:var(--text);padding:9px}textarea{min-height:90px;resize:vertical}.stack{display:grid;gap:8px}.record{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0d1219}.record h4{margin:0 0 4px}.recordmeta{font-size:10px;color:var(--muted)}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 6px;font-size:9px;color:var(--muted);margin:2px}.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}.bottom{position:fixed;left:7px;right:7px;bottom:max(7px,env(safe-area-inset-bottom));z-index:40;display:flex;gap:3px;border:1px solid var(--line);background:#10151df2;padding:4px;border-radius:14px;box-shadow:var(--shadow);overflow:auto}.bottom button{flex:1;min-width:56px;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 3px;font-size:9px}.bottom button b{display:block;font-size:15px}.bottom button.active{background:#b7a7ff13;color:var(--text)}dialog{border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--text);width:min(92vw,620px);padding:0}dialog::backdrop{background:#000a}.dhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}.dbody{padding:14px}.dockframe{width:100%;height:min(62vh,620px);border:1px solid var(--line);border-radius:12px;background:#fff}.trace{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}.notice{border-left:3px solid var(--accent);background:#b7a7ff0c;padding:9px;border-radius:8px}.notice.warn{border-color:var(--warn)}.notice.bad{border-color:var(--bad)}.toastbox{position:fixed;right:10px;top:70px;z-index:100;display:grid;gap:6px}.toast{max-width:340px;border:1px solid var(--line);border-radius:10px;background:#171d26;padding:9px 11px;box-shadow:var(--shadow);font-size:11px}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.app{padding-left:9px;padding-right:9px}.top{margin-left:-9px;margin-right:-9px;padding-left:9px;padding-right:9px}.brand small{display:none}.hero{padding:15px}.main{padding-top:10px}.panel{padding:11px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="toprow"><button class="brand" id="brandBtn" type="button"><b id="appName">CORE TEMPLATE</b><small>v0.1 · referência funcional</small></button><div class="spacer"></div><button class="icon" id="favBtn" type="button" title="Favoritar página">☆</button><button class="icon" id="captureBtn" type="button" title="Quick Capture">＋</button></div>
 <div id="breadcrumbs" class="crumbs"></div>
 <div class="searchbar"><input id="globalSearch" placeholder="Buscar registros, materiais, biblioteca…"><button class="btn" id="searchBtn" type="button">Buscar</button></div>
</header>
<main id="outlet" class="main" tabindex="-1"></main>
</div>
<nav id="bottomNav" class="bottom"></nav>
<div id="toasts" class="toastbox"></div>
<dialog id="captureDialog"><div class="dhead"><b>Quick Capture</b><button class="btn" data-close="captureDialog" type="button">Fechar</button></div><form id="captureForm" class="dbody stack"><label>Cômodo<select id="captureRoom"></select></label><label>Título<input id="captureTitle" placeholder="Opcional"></label><label>Conteúdo<textarea id="captureText" required placeholder="Anotação rápida"></textarea></label><button class="btn primary" type="submit">Salvar captura</button></form></dialog>
<input id="dockFileInput" type="file" accept="text/html,.html" hidden>
<script>
(()=>{'use strict';
const CONFIG=window.CORE_TEMPLATE_CONFIG={
 appId:'core.template.reserve',appName:'Core Template',version:'0.1.0',bridgeVersion:'0.3',
 rooms:[
  {id:'pessoal',label:'Pessoal',icon:'◇',description:'Exemplo de cômodo de vida prática.'},
  {id:'oficina',label:'Oficina',icon:'◉',description:'Exemplo de área de criação, ferramentas e materiais.'},
  {id:'conhecimento',label:'Conhecimento',icon:'✦',description:'Exemplo de referências, estudo e acervo.'},
  {id:'trabalho',label:'Trabalho',icon:'▣',description:'Exemplo de área profissional.'}
 ]
};
const C=window.TemplateCore={};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>`${p}:${Date.now().toString(36)}:${Math.random().toString(36).slice(2,8)}`;
const roomInfo=id=>CONFIG.rooms.find(r=>r.id===id)||{id,label:id,icon:'◇',description:''};
const now=()=>new Date().toISOString();
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),2800)}

// ---------- Events / Commands ----------
C.events={_m:new Map(),on(n,f){if(!this._m.has(n))this._m.set(n,new Set());this._m.get(n).add(f);return()=>this._m.get(n)?.delete(f)},emit(n,p){this._m.get(n)?.forEach(f=>{try{f(p)}catch(e){console.error(e)}})}};
C.commands={_m:new Map(),register(n,f){this._m.set(n,f)},async dispatch(n,p){if(!this._m.has(n))throw Error('Comando não registrado: '+n);return this._m.get(n)(p)}};

// ---------- Trace ----------
C.trace={enabled:localStorage.getItem('template.trace')==='1',entries:[],set(v){this.enabled=!!v;localStorage.setItem('template.trace',v?'1':'0')},log(stage,meta={}){if(!this.enabled)return;const clean={};for(const[k,v]of Object.entries(meta)){clean[k]=/text|content|payload|blob|dataurl|image/i.test(k)?'[omitido]':typeof v==='string'?v.slice(0,160):v}this.entries.unshift({ts:now(),stage,meta:clean});this.entries=this.entries.slice(0,300);C.events.emit('trace',this.entries[0])}};

// ---------- Storage ----------
const DBN='core-template-reserve-v01',DBV=1,STORES=['records','meta','assets','tools','toolState'];let db=null,storeMode='indexedDB';
function req(q){return new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function done(tx){return new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||Error('abort'))})}
async function initDB(){try{db=await new Promise((res,rej)=>{const q=indexedDB.open(DBN,DBV);q.onupgradeneeded=()=>{const d=q.result;for(const s of STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});}catch(e){storeMode='localStorage';console.warn(e)}}
async function put(store,row){if(storeMode==='localStorage'){const k='tpl.'+store,a=JSON.parse(localStorage.getItem(k)||'[]'),i=a.findIndex(x=>x.id===row.id);i>=0?a[i]=row:a.push(row);localStorage.setItem(k,JSON.stringify(a));return row}const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(row);await done(tx);return row}
async function get(store,id){if(storeMode==='localStorage')return JSON.parse(localStorage.getItem('tpl.'+store)||'[]').find(x=>x.id===id)||null;return req(db.transaction(store).objectStore(store).get(id))}
async function all(store){if(storeMode==='localStorage')return JSON.parse(localStorage.getItem('tpl.'+store)||'[]');return req(db.transaction(store).objectStore(store).getAll())}
async function del(store,id){if(storeMode==='localStorage'){const k='tpl.'+store,a=JSON.parse(localStorage.getItem(k)||'[]').filter(x=>x.id!==id);localStorage.setItem(k,JSON.stringify(a));return}const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);await done(tx)}
C.storage={put,get,all,del,get mode(){return storeMode}};

// ---------- Record / Materials ----------
C.records={async save(r){const row={id:r.id||uid('rec'),recordType:r.recordType||'Record',room:r.room||'pessoal',title:r.title||r.recordType||'Registro',text:r.text||'',tags:r.tags||[],createdAt:r.createdAt||now(),data:r.data||{},scope:r.scope||'room',source:r.source||'core',...r};await put('records',row);C.events.emit('record:saved',row);return row},async list(){return (await all('records')).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))}};
C.materials={async list(room,scope='visible'){const rows=await C.records.list();return rows.filter(r=>r.recordType==='Material'&&(scope==='house'?r.scope==='house':r.scope==='house'||r.room===room))},async addFromLibrary(item,room,scope='room'){return C.records.save({recordType:'Material',room,scope,title:item.title,text:item.description||'',data:{libraryId:item.id,kind:item.kind,mime:item.mime||''},source:'library'})}};

// ---------- Library ----------
C.library={async add(item){const row={id:item.id||uid('lib'),title:item.title||'Item',kind:item.kind||'text',description:item.description||'',tags:item.tags||[],schema:item.schema||'core-library/0.1',scope:item.scope||'house',room:item.room||'',mime:item.mime||'',url:item.url||'',text:item.text||'',blob:item.blob||null,createdAt:item.createdAt||now(),provenance:item.provenance||{method:'user-import'}};await put('assets',row);return row},async list(q={}){let a=await all('assets');if(q.kind)a=a.filter(x=>x.kind===q.kind);if(q.schema)a=a.filter(x=>x.schema===q.schema);if(q.query){const z=q.query.toLowerCase();a=a.filter(x=>JSON.stringify({title:x.title,tags:x.tags,description:x.description,schema:x.schema}).toLowerCase().includes(z))}return a.sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt)))},async get(id){return get('assets',id)}};

// ---------- Module Registry ----------
C.modules={items:[],activeCleanup:null,register(manifest,mount){this.items.push({manifest,mount})},roomsFor(m){return m.rooms||[m.room].filter(Boolean)},forRoom(room){return this.items.filter(x=>this.roomsFor(x.manifest).includes(room))},resolve(path){return this.items.find(x=>(x.manifest.routes||[]).includes(path))},async mount(path,el){const m=this.resolve(path);if(!m)return false;if(this.activeCleanup){try{await this.activeCleanup()}catch{}}this.activeCleanup=null;const ret=await m.mount(el,{core:C,storage:C.storage,records:C.records,library:C.library,materials:C.materials,router:C.router,room:roomFromPath(path)});if(typeof ret==='function')this.activeCleanup=ret;return true},async unmount(){if(this.activeCleanup){try{await this.activeCleanup()}catch{}this.activeCleanup=null}}};
function roomFromPath(path){const m=C.modules.resolve(path);if(!m)return'';return C.modules.roomsFor(m.manifest)[0]||''}

// ---------- Router ----------
C.router={path(){return(location.hash.replace(/^#\/?/,'')||'home')},go(p){location.hash='#/'+p},parent(p=this.path()){if(p.startsWith('room/'))return'home';const m=C.modules.resolve(p);if(m){const room=C.modules.roomsFor(m.manifest)[0];return'room/'+room}return'home'}};
window.addEventListener('hashchange',()=>renderRoute());

// ---------- Favorites ----------
C.favorites={async list(){const r=await get('meta','favorites');return r?.value||[]},async toggle(path,label){let a=await this.list(),i=a.findIndex(x=>x.path===path);if(i>=0)a.splice(i,1);else a.push({path,label,createdAt:now()});await put('meta',{id:'favorites',value:a});return a.some(x=>x.path===path)},async has(path){return (await this.list()).some(x=>x.path===path)}};

// ---------- Dock / Bridge ----------
C.bridge={version:'0.3',sessions:new Map()};
let dockPending=null,dockCurrent=null;
function makeToken(){return uid('bridge')}
async function dockLoadSource({name,source,sourceType='html',url='',room='oficina',permissions={},fixed=false,id=null}){const toolId=id||uid('tool');dockCurrent={id:toolId,name,source,sourceType,url,room,permissions,token:makeToken(),manifest:null,fixed};C.trace.log('dock.session.open',{toolId,room,sourceType});renderDock();setTimeout(()=>bridgeInit(),80)}
function bridgeInit(){const fr=$('#dockFrame');if(!fr||!dockCurrent)return;fr.contentWindow?.postMessage({type:'casa:bridge:init',bridgeVersion:C.bridge.version,token:dockCurrent.token,room:dockCurrent.room,permissions:dockCurrent.permissions,core:{appId:CONFIG.appId,appName:CONFIG.appName}},'*');C.trace.log('bridge.init',{toolId:dockCurrent.id,room:dockCurrent.room})}
window.addEventListener('message',async ev=>{const m=ev.data||{};if(!dockCurrent||ev.source!==$('#dockFrame')?.contentWindow)return;if(m.token&&m.token!==dockCurrent.token)return;C.trace.log('bridge.message',{type:m.type,toolId:dockCurrent.id});const reply=(data)=>ev.source?.postMessage({...data,token:dockCurrent.token},'*');
 if(m.type==='casa:tool:hello'){dockCurrent.manifest=m.manifest||{};reply({type:'casa:bridge:ack',bridgeVersion:C.bridge.version,room:dockCurrent.room,permissions:dockCurrent.permissions});await persistDockCurrent();renderDockStatus();return}
 if(m.type==='casa:tool:get-state'){if(!dockCurrent.permissions.state)return reply({type:'casa:bridge:state',error:'permission-denied'});const s=await get('toolState',dockCurrent.id);return reply({type:'casa:bridge:state',state:s?.value||null})}
 if(m.type==='casa:tool:save-state'){if(!dockCurrent.permissions.state)return;await put('toolState',{id:dockCurrent.id,value:m.state,updatedAt:now()});return reply({type:'casa:bridge:state-saved'})}
 if(m.type==='casa:tool:request-materials'){if(!dockCurrent.permissions.materials)return reply({type:'casa:bridge:materials',items:[],error:'permission-denied'});const a=await C.materials.list(dockCurrent.room,m.scope==='house'?'house':'visible');return reply({type:'casa:bridge:materials',items:a.map(x=>({id:x.id,title:x.title,room:x.room,scope:x.scope,data:x.data}))})}
 if(m.type==='casa:tool:request-library'){if(!dockCurrent.permissions.library)return reply({type:'casa:bridge:library',items:[],error:'permission-denied'});const a=await C.library.list(m.query||m);return reply({type:'casa:bridge:library',library:{id:'core-template-library',version:'0.1'},items:a.map(x=>({id:x.id,title:x.title,kind:x.kind,tags:x.tags,schema:x.schema,mime:x.mime,url:x.url}))})}
 if(m.type==='casa:tool:request-library-item'){if(!dockCurrent.permissions.library)return;const x=await C.library.get(m.id);if(!x)return reply({type:'casa:bridge:library-item',error:'not-found'});let content={id:x.id,title:x.title,kind:x.kind,mime:x.mime,url:x.url,text:x.text};if(x.blob instanceof Blob){content.objectUrl=URL.createObjectURL(x.blob);setTimeout(()=>URL.revokeObjectURL(content.objectUrl),60000)}return reply({type:'casa:bridge:library-item',item:content})}
 if(m.type==='casa:tool:save-record'){if(!dockCurrent.permissions.write)return reply({type:'casa:bridge:record-saved',error:'permission-denied'});const r=await C.records.save({...m.record,room:dockCurrent.room,source:'dock:'+dockCurrent.id});return reply({type:'casa:bridge:record-saved',id:r.id})}
 if(m.type==='casa:tool:export'){if(!dockCurrent.permissions.export)return;downloadPayload(m.filename||'tool-export.json',m.mimeType||'application/json',m.payload);return reply({type:'casa:bridge:exported'})}
});
function downloadPayload(name,mime,payload){const data=typeof payload==='string'?payload:JSON.stringify(payload,null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function persistDockCurrent(){if(!dockCurrent)return;await put('tools',{id:dockCurrent.id,name:dockCurrent.name,room:dockCurrent.room,sourceType:dockCurrent.sourceType,source:dockCurrent.sourceType==='html'?dockCurrent.source:'',url:dockCurrent.url,permissions:dockCurrent.permissions,manifest:dockCurrent.manifest,fixed:dockCurrent.fixed,bridgeVersion:'0.3',updatedAt:now()})}
async function openRegisteredTool(id){const t=await get('tools',id);if(!t)return toast('Ferramenta não encontrada.');await dockLoadSource({...t,id:t.id});C.router.go('dock')}

// ---------- UI helpers ----------
function setCrumbs(items){$('#breadcrumbs').innerHTML=items.map((x,i)=>`${i?'<span>/</span>':''}${x.path?`<button type="button" data-cpath="${esc(x.path)}">${esc(x.label)}</button>`:`<span>${esc(x.label)}</span>`}`).join('');$$('[data-cpath]').forEach(b=>b.onclick=()=>C.router.go(b.dataset.cpath))}
async function updateFav(){const p=C.router.path();$('#favBtn').textContent=await C.favorites.has(p)?'★':'☆'}
function renderBottom(path){const core=[{path:'home',label:'Início',icon:'◎'},...CONFIG.rooms.slice(0,4).map(r=>({path:'room/'+r.id,label:r.label,icon:r.icon})),{path:'search',label:'Busca',icon:'⌕'}];$('#bottomNav').innerHTML=core.map(x=>`<button type="button" data-route="${x.path}" class="${path===x.path?'active':''}"><b>${x.icon}</b>${esc(x.label)}</button>`).join('');$$('[data-route]').forEach(b=>b.onclick=()=>C.router.go(b.dataset.route))}

async function renderRoute(){const path=C.router.path();renderBottom(path);await C.modules.unmount();const out=$('#outlet');out.innerHTML='';try{if(await C.modules.mount(path,out)){await updateFav();return}if(path==='home')await renderHome();else if(path.startsWith('room/'))await renderRoom(path.split('/')[1]);else if(path==='search')await renderSearch();else if(path==='favorites')await renderFavorites();else if(path==='dock')await renderDock();else if(path==='library')await renderLibrary();else if(path==='importer')await renderImporter();else if(path==='debug')await renderDebug();else await renderHome();await updateFav();out.focus({preventScroll:true})}catch(e){console.error(e);out.innerHTML=`<div class="notice bad"><b>CORE · FALHA DE ROTA</b><br>${esc(e.message)}</div>`;C.trace.log('route.error',{path,error:e.message})}}

async function renderHome(){setCrumbs([{label:'Core Template'}]);const recs=await C.records.list(),libs=await C.library.list(),tools=await all('tools');$('#outlet').innerHTML=`<section class="hero"><span class="ey">CORE TEMPLATE · RESERVA</span><h1 style="margin:5px 0">Base funcional para novos sistemas</h1><p class="muted">Clone esta base, renomeie os cômodos no CONFIG e adicione ferramentas como módulos nativos ou HTMLs móveis pela Doca. Bridge 0.3 já incluída.</p><div class="metrics"><span class="metric">${CONFIG.rooms.length} cômodos</span><span class="metric">${recs.length} registros</span><span class="metric">${libs.length} itens no Acervo</span><span class="metric">${tools.length} ferramentas registradas</span><span class="metric">Bridge ${C.bridge.version}</span></div></section><div class="grid roomgrid">${CONFIG.rooms.map(r=>`<button class="roomcard" data-room="${r.id}" type="button"><span class="ey">CÔMODO</span><h3>${r.icon} ${esc(r.label)}</h3><div class="help">${esc(r.description)}</div></button>`).join('')}</div><section class="panel" style="margin-top:14px"><div class="sectionhead"><div><span class="ey">INFRAESTRUTURA</span><h2>Capacidades transversais</h2></div></div><div class="row"><button class="btn" data-core="library">Biblioteca / Acervo</button><button class="btn" data-core="dock">Doca / Alfândega</button><button class="btn" data-core="importer">Importador</button><button class="btn" data-core="favorites">Favoritos</button><button class="btn" data-core="debug">Debug / Trace</button></div></section>`;$$('[data-room]').forEach(b=>b.onclick=()=>C.router.go('room/'+b.dataset.room));$$('[data-core]').forEach(b=>b.onclick=()=>C.router.go(b.dataset.core))}

async function renderRoom(room){const info=roomInfo(room),mods=C.modules.forRoom(room),tools=(await all('tools')).filter(t=>t.fixed&&t.room===room),materials=await C.materials.list(room),recs=(await C.records.list()).filter(r=>r.room===room);setCrumbs([{label:'Core',path:'home'},{label:info.label}]);$('#outlet').innerHTML=`<section class="hero"><span class="ey">HUB DO CÔMODO</span><h1 style="margin:4px 0">${info.icon} ${esc(info.label)}</h1><p class="muted">${esc(info.description)}</p><div class="metrics"><span class="metric">${mods.length+tools.length} ferramentas</span><span class="metric">${materials.length} materiais</span><span class="metric">${recs.length} registros</span></div></section><section class="panel" style="margin-top:12px"><div class="sectionhead"><div><span class="ey">FERRAMENTAS</span><h2>Habitantes</h2></div><button class="btn" id="dockHere">＋ Atracar aqui</button></div><div class="grid g2">${[...mods.map(m=>`<button class="toolcard" data-modroute="${m.manifest.routes[0]}"><span class="ey">NATIVA</span><h3>${esc(m.manifest.name)}</h3><div class="help">${esc(m.manifest.description||'Módulo nativo')}</div></button>`),...tools.map(t=>`<button class="toolcard" data-exttool="${t.id}"><span class="ey">EXTERNA · BRIDGE ${esc(t.bridgeVersion||'—')}</span><h3>${esc(t.name)}</h3><div class="help">${esc(t.manifest?.outputs?.join(' · ')||'HTML móvel')}</div></button>`)].join('')||'<div class="empty">Sala vazia — endereço válido mesmo sem ferramentas.</div>'}</div></section><section class="panel" style="margin-top:12px"><div class="sectionhead"><div><span class="ey">MATÉRIA-PRIMA</span><h2>Prateleira compartilhada</h2></div><button class="btn" id="materialFromLibrary">Trazer do Acervo</button></div><div class="stack">${materials.map(m=>`<div class="record"><h4>${esc(m.title)}</h4><div class="recordmeta">${esc(m.scope)} · ${esc(m.data?.kind||'material')}</div></div>`).join('')||'<div class="empty">Nenhum material nesta bancada.</div>'}</div></section>`;$$('[data-modroute]').forEach(b=>b.onclick=()=>{C.events.emit('room:tool-open',{room,path:b.dataset.modroute});C.router.go(b.dataset.modroute)});$$('[data-exttool]').forEach(b=>b.onclick=()=>openRegisteredTool(b.dataset.exttool));$('#dockHere').onclick=()=>{dockPending={room};C.router.go('dock')};$('#materialFromLibrary').onclick=()=>{localStorage.setItem('template.library.targetRoom',room);C.router.go('library')}}

async function renderSearch(){setCrumbs([{label:'Core',path:'home'},{label:'Busca'}]);const q=($('#globalSearch').value||'').trim().toLowerCase(),recs=await C.records.list(),lib=await C.library.list({query:q});const rr=q?recs.filter(r=>JSON.stringify({title:r.title,text:r.text,tags:r.tags,room:r.room,recordType:r.recordType}).toLowerCase().includes(q)):recs;$('#outlet').innerHTML=`<section class="panel"><div class="sectionhead"><div><span class="ey">BUSCA</span><h2>${q?'Resultados para “'+esc(q)+'”':'Tudo que está indexado'}</h2></div></div><div class="grid g2"><div><h3>Registros</h3><div class="stack">${rr.map(recordCard).join('')||'<div class="empty">Nenhum registro.</div>'}</div></div><div><h3>Biblioteca</h3><div class="stack">${lib.map(x=>`<div class="record"><h4>${esc(x.title)}</h4><div class="recordmeta">${esc(x.kind)} · ${esc(x.schema)}</div></div>`).join('')||'<div class="empty">Nenhum item.</div>'}</div></div></section>`}
function recordCard(r){return`<div class="record"><h4>${esc(r.title)}</h4><div>${esc(r.text||'')}</div><div class="recordmeta">${esc(roomInfo(r.room).label)} · ${esc(r.recordType)} · ${new Date(r.createdAt).toLocaleString('pt-BR')}</div></div>`}

async function renderFavorites(){setCrumbs([{label:'Core',path:'home'},{label:'Favoritos'}]);const a=await C.favorites.list();$('#outlet').innerHTML=`<section class="panel"><div class="sectionhead"><div><span class="ey">FAVORITOS</span><h2>Atalhos pessoais</h2></div></div><div class="stack">${a.map(x=>`<button class="toolcard" data-favpath="${esc(x.path)}"><h3>${esc(x.label)}</h3><div class="help">${esc(x.path)}</div></button>`).join('')||'<div class="empty">Nenhum favorito.</div>'}</div></section>`;$$('[data-favpath]').forEach(b=>b.onclick=()=>C.router.go(b.dataset.favpath))}

async function renderLibrary(){setCrumbs([{label:'Core',path:'home'},{label:'Biblioteca / Acervo'}]);const items=await C.library.list(),target=localStorage.getItem('template.library.targetRoom')||'';$('#outlet').innerHTML=`<section class="hero"><span class="ey">BIBLIOTECA / ACERVO</span><h1 style="margin:4px 0">Uma referência, múltiplas ferramentas</h1><p class="muted">Itens persistentes ficam aqui. Materiais são cópias de trabalho/endereço na bancada.</p></section><section class="panel" style="margin-top:12px"><div class="sectionhead"><div><h2>Adicionar item</h2></div></div><form id="libForm" class="grid g2"><label>Título<input id="libTitle" required></label><label>Tipo<select id="libKind"><option value="text">Texto</option><option value="link">Link</option><option value="image">Imagem</option><option value="file">Arquivo</option><option value="object">Objeto</option></select></label><label style="grid-column:1/-1">Descrição<textarea id="libDesc"></textarea></label><label>URL<input id="libUrl" placeholder="https://..."></label><label>Arquivo<input id="libFile" type="file"></label><label>Schema / perfil<input id="libSchema" value="core-library/0.1"></label><label>Tags<input id="libTags" placeholder="referência, projeto"></label><button class="btn primary" style="grid-column:1/-1">Guardar no Acervo</button></form></section><section class="panel" style="margin-top:12px"><div class="sectionhead"><div><h2>Itens</h2><div class="help">${target?'Destino temporário: '+esc(roomInfo(target).label):'Nenhum cômodo de destino selecionado.'}</div></div></div><div class="stack">${items.map(x=>`<div class="record"><div class="sectionhead"><div><h4>${esc(x.title)}</h4><div class="recordmeta">${esc(x.kind)} · ${esc(x.schema)}</div></div>${target?`<button class="btn" data-to-room="${x.id}">Usar em ${esc(roomInfo(target).label)}</button>`:''}</div><div class="help">${esc(x.description||x.url||'')}</div></div>`).join('')||'<div class="empty">Acervo vazio.</div>'}</div></section>`;$('#libForm').onsubmit=async e=>{e.preventDefault();let blob=null,mime='';const f=$('#libFile').files?.[0];if(f){blob=f;mime=f.type}await C.library.add({title:$('#libTitle').value,kind:$('#libKind').value,description:$('#libDesc').value,url:$('#libUrl').value,schema:$('#libSchema').value,tags:$('#libTags').value.split(',').map(x=>x.trim()).filter(Boolean),blob,mime});toast('Item guardado no Acervo.');renderLibrary()};$$('[data-to-room]').forEach(b=>b.onclick=async()=>{const x=await C.library.get(b.dataset.toRoom);await C.materials.addFromLibrary(x,target,'room');toast('Material colocado na bancada.');localStorage.removeItem('template.library.targetRoom');C.router.go('room/'+target)})}

async function renderDock(){setCrumbs([{label:'Core',path:'home'},{label:'Doca / Alfândega'}]);const tools=await all('tools'),defaultRoom=dockCurrent?.room||dockPending?.room||CONFIG.rooms[0].id;$('#outlet').innerHTML=`<section class="hero"><span class="ey">DOCA · BRIDGE ${C.bridge.version}</span><h1 style="margin:4px 0">Ferramentas móveis</h1><p class="muted">Atracar não incorpora. O HTML mantém identidade própria e recebe apenas as capacidades autorizadas pela Alfândega.</p></section><section class="panel" style="margin-top:12px"><div class="grid g2"><div class="stack"><label>HTML independente<button class="btn" id="chooseTool">Escolher .html</button></label><label>ou URL<input id="dockUrl" placeholder="https://..."></label><label>Cômodo<select id="dockRoom">${CONFIG.rooms.map(r=>`<option value="${r.id}" ${r.id===defaultRoom?'selected':''}>${esc(r.label)}</option>`).join('')}</select></label><div class="grid g2"><label><span><input id="permMaterials" type="checkbox" checked> materiais</span></label><label><span><input id="permLibrary" type="checkbox" checked> biblioteca</span></label><label><span><input id="permWrite" type="checkbox" checked> gravar registros</span></label><label><span><input id="permState" type="checkbox" checked> estado</span></label><label><span><input id="permExport" type="checkbox" checked> exportar</span></label></div><div class="row"><button class="btn primary" id="dockUrlBtn">Atracar URL</button><button class="btn" id="fixTool" ${dockCurrent?'':'disabled'}>${dockCurrent?.fixed?'Porta fixada':'Fixar porta no cômodo'}</button><button class="btn bad" id="releaseTool" ${dockCurrent?'':'disabled'}>Soltar</button></div><div id="dockStatus" class="notice">${dockCurrent?`Sessão: <b>${esc(dockCurrent.name)}</b> · ${esc(roomInfo(dockCurrent.room).label)}`:'Nenhuma ferramenta atracada.'}</div></div><div><h3>Ferramentas registradas</h3><div class="stack">${tools.map(t=>`<div class="record"><h4>${esc(t.name)}</h4><div class="recordmeta">${esc(roomInfo(t.room).label)} · ${t.fixed?'porta fixa':'registrada'} · Bridge ${esc(t.bridgeVersion||'—')}</div><div class="row"><button class="btn" data-open-tool="${t.id}">Abrir</button><button class="btn bad" data-del-tool="${t.id}">Remover registro</button></div></div>`).join('')||'<div class="empty">Nenhuma ferramenta registrada.</div>'}</div></div></div></section>${dockCurrent?`<section class="panel" style="margin-top:12px"><iframe id="dockFrame" class="dockframe" sandbox="allow-scripts allow-forms allow-downloads allow-modals" ${dockCurrent.sourceType==='html'?`srcdoc="${esc(dockCurrent.source)}"`:`src="${esc(dockCurrent.url)}"`}></iframe></section>`:''}`;$('#chooseTool').onclick=()=>$('#dockFileInput').click();$('#dockUrlBtn').onclick=()=>{const url=$('#dockUrl').value.trim();if(!url)return;dockLoadSource({name:url,source:'',sourceType:'url',url,room:$('#dockRoom').value,permissions:perms()})};$('#fixTool').onclick=async()=>{if(!dockCurrent)return;dockCurrent.fixed=true;dockCurrent.room=$('#dockRoom').value;dockCurrent.permissions=perms();await persistDockCurrent();toast('Porta fixada em '+roomInfo(dockCurrent.room).label);renderDock()};$('#releaseTool').onclick=()=>{dockCurrent=null;renderDock()};$$('[data-open-tool]').forEach(b=>b.onclick=()=>openRegisteredTool(b.dataset.openTool));$$('[data-del-tool]').forEach(b=>b.onclick=async()=>{await del('tools',b.dataset.delTool);renderDock()});dockPending=null;if(dockCurrent)setTimeout(bridgeInit,100)}
function perms(){return{materials:$('#permMaterials')?.checked??true,library:$('#permLibrary')?.checked??true,write:$('#permWrite')?.checked??true,state:$('#permState')?.checked??true,export:$('#permExport')?.checked??true}}
function renderDockStatus(){const e=$('#dockStatus');if(e&&dockCurrent)e.innerHTML=`Conectada: <b>${esc(dockCurrent.manifest?.name||dockCurrent.name)}</b> · ${esc(roomInfo(dockCurrent.room).label)} · Bridge ${esc(dockCurrent.manifest?.bridgeVersion||'?')}`}
$('#dockFileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const source=await f.text();const room=C.router.path()==='dock'?($('#dockRoom')?.value||CONFIG.rooms[0].id):CONFIG.rooms[0].id;await dockLoadSource({name:f.name,source,sourceType:'html',room,permissions:perms()});C.router.go('dock');e.target.value=''};

async function renderImporter(){setCrumbs([{label:'Core',path:'home'},{label:'Importador'}]);$('#outlet').innerHTML=`<section class="panel"><div class="sectionhead"><div><span class="ey">IMPORTADOR</span><h2>JSON / TXT em blocos</h2></div></div><label>Arquivo<input id="impFile" type="file" accept=".json,.txt,application/json,text/plain"></label><label>Destino padrão<select id="impRoom">${CONFIG.rooms.map(r=>`<option value="${r.id}">${esc(r.label)}</option>`).join('')}</select></label><label>Separador TXT<input id="impSep" placeholder="Automático: ---, ===, ***, ___, §§§"></label><button class="btn primary" id="impRun">Importar</button><div id="impResult" class="notice" style="margin-top:10px">Nenhum arquivo processado.</div></section>`;$('#impRun').onclick=async()=>{const f=$('#impFile').files?.[0];if(!f)return toast('Escolha um arquivo.');const t=await f.text();let n=0;if(f.name.toLowerCase().endsWith('.json')){const x=JSON.parse(t);const arr=Array.isArray(x)?x:Array.isArray(x.records)?x.records:[x];for(const r of arr){await C.records.save({...r,room:r.room||$('#impRoom').value,source:'import:'+f.name});n++}}else{const sep=$('#impSep').value.trim(),parts=sep?t.split(sep):t.split(/\n(?:---+|===+|\*\*\*+|___+|§§§+)\s*\n/g);for(let i=0;i<parts.length;i++){const block=parts[i].trim();if(!block)continue;let room=$('#impRoom').value,title='Bloco '+(i+1),tags=[],body=[];for(const line of block.split(/\r?\n/)){if(/^@room:/i.test(line))room=line.split(':').slice(1).join(':').trim()||room;else if(/^@title:/i.test(line))title=line.split(':').slice(1).join(':').trim()||title;else if(/^@tags:/i.test(line))tags=line.split(':').slice(1).join(':').split(',').map(x=>x.trim()).filter(Boolean);else body.push(line)}await C.records.save({recordType:'RawBlock',room,title,text:body.join('\n').trim(),tags,source:'import:'+f.name,data:{blockIndex:i}});n++}}$('#impResult').textContent=n+' bloco(s)/registro(s) importado(s).'} }

async function renderDebug(){setCrumbs([{label:'Core',path:'home'},{label:'Debug / Trace'}]);$('#outlet').innerHTML=`<section class="panel"><div class="sectionhead"><div><span class="ey">OFICINA DO CORE</span><h2>Trace</h2></div><div class="row"><button class="btn" id="traceToggle">Trace: ${C.trace.enabled?'ON':'OFF'}</button><button class="btn" id="traceClear">Limpar</button></div></div><p class="help">Estrutura e etapas; conteúdo sensível é omitido por padrão.</p><div id="traceList" class="stack">${C.trace.entries.map(x=>`<div class="record trace">${esc(x.ts)}\n${esc(x.stage)}\n${esc(JSON.stringify(x.meta))}</div>`).join('')||'<div class="empty">Trace vazio.</div>'}</div></section>`;$('#traceToggle').onclick=()=>{C.trace.set(!C.trace.enabled);renderDebug()};$('#traceClear').onclick=()=>{C.trace.entries=[];renderDebug()}}

// ---------- Example native modules ----------
C.modules.register({id:'example.notes',name:'Notas de Exemplo',version:'0.1.0',room:'pessoal',routes:['example/notes'],description:'Módulo nativo mínimo usando Records do Core.'},async(el,ctx)=>{setCrumbs([{label:'Core',path:'home'},{label:roomInfo(ctx.room).label,path:'room/'+ctx.room},{label:'Notas de Exemplo'}]);const rows=(await C.records.list()).filter(r=>r.source==='example.notes');el.innerHTML=`<section class="panel"><div class="sectionhead"><div><span class="ey">EXEMPLO NATIVO</span><h2>Notas</h2></div></div><form id="noteForm" class="stack"><input id="noteTitle" placeholder="Título"><textarea id="noteText" required placeholder="Nota"></textarea><button class="btn primary">Salvar</button></form><div class="stack" style="margin-top:10px">${rows.map(recordCard).join('')||'<div class="empty">Nenhuma nota.</div>'}</div></section>`;$('#noteForm').onsubmit=async e=>{e.preventDefault();await C.records.save({recordType:'Note',room:ctx.room,title:$('#noteTitle').value||'Nota',text:$('#noteText').value,source:'example.notes'});toast('Nota salva.');C.router.go('example/notes')}});
C.modules.register({id:'example.shared',name:'Agenda Compartilhada de Exemplo',version:'0.1.0',rooms:['pessoal','trabalho'],routes:['example/agenda'],description:'Demonstra um único módulo com porta em dois cômodos.'},async(el)=>{const path=C.router.path(),room=localStorage.getItem('template.agenda.room')||'pessoal';setCrumbs([{label:'Core',path:'home'},{label:roomInfo(room).label,path:'room/'+room},{label:'Agenda Compartilhada'}]);const rows=(await C.records.list()).filter(r=>r.recordType==='AgendaItem');el.innerHTML=`<section class="panel"><div class="sectionhead"><div><span class="ey">EXEMPLO MULTI-CÔMODO</span><h2>Agenda compartilhada</h2></div></div><form id="agendaForm" class="grid g2"><label>Tarefa<input id="agendaTitle" required></label><label>Escopo<select id="agendaScope"><option value="pessoal">Pessoal</option><option value="trabalho">Trabalho</option><option value="ambos">Ambos</option></select></label><button class="btn primary" style="grid-column:1/-1">Adicionar</button></form><div class="stack" style="margin-top:10px">${rows.map(recordCard).join('')||'<div class="empty">Agenda vazia.</div>'}</div></section>`;$('#agendaForm').onsubmit=async e=>{e.preventDefault();await C.records.save({recordType:'AgendaItem',room:$('#agendaScope').value==='trabalho'?'trabalho':'pessoal',title:$('#agendaTitle').value,text:'',source:'example.shared',data:{scope:$('#agendaScope').value}});toast('Item adicionado.');C.router.go('example/agenda')}});

// Make room cards remember which door was used for shared tool.
C.events.on('room:tool-open',x=>localStorage.setItem('template.agenda.room',x.room));

// ---------- Quick Capture ----------
function openCapture(room){$('#captureRoom').innerHTML=CONFIG.rooms.map(r=>`<option value="${r.id}" ${r.id===room?'selected':''}>${esc(r.label)}</option>`).join('');$('#captureText').value='';$('#captureTitle').value='';$('#captureDialog').showModal()}
$('#captureForm').onsubmit=async e=>{e.preventDefault();await C.records.save({recordType:'RawCapture',room:$('#captureRoom').value,title:$('#captureTitle').value||'Captura rápida',text:$('#captureText').value,source:'core.quick-capture'});$('#captureDialog').close();toast('Captura salva.')};
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());

// ---------- Boot ----------
async function boot(){await initDB();$('#appName').textContent=CONFIG.appName.toUpperCase();$('#brandBtn').onclick=()=>C.router.go('home');$('#captureBtn').onclick=()=>openCapture(C.router.path().startsWith('room/')?C.router.path().split('/')[1]:CONFIG.rooms[0].id);$('#favBtn').onclick=async()=>{const p=C.router.path();await C.favorites.toggle(p,p==='home'?CONFIG.appName:p);updateFav()};$('#searchBtn').onclick=()=>C.router.go('search');$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')C.router.go('search')});if(!location.hash)location.hash='#/home';await renderRoute();C.trace.log('core.boot',{version:CONFIG.version,storage:storeMode})}
boot().catch(e=>{$('#outlet').innerHTML=`<div class="notice bad"><b>CORE · FALHA DE BOOT</b><br>${esc(e.message)}</div>`;console.error(e)});
})();
</script>
</body></html>
